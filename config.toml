baseURL               = "https://web-panel.vpmaxs.dpdns.org/"
locale                = "zh-CN"
title                 = "WebStack-Hugo 网址导航"
theme                 = "WebStack-Hugo"
preserveTaxonomyNames = true
disablePathToLower    = true
hasCJKLanguage        = true
publishDir            = "public"				# 站点静态文件保存目录


[params]
    author        = "xmore2046"
    description   = "网址导航 | WebStack-Hugo"
    upload        = ""                                                        # 左侧导航栏的"网站提交"
    about         = "mailto:xmore2046@outlook.com"	                          # 左侧导航栏的"关于导航"页面(./about)
    repository    = "https://github.com/shenweiyan/WebStack-Hugo"  
    enablePreLoad = false					# 关闭预加载动画（避免打开页面时的方块滑动加载效果）
    textPreLoad   = "网址导航"					# 预加载的动画文字, 只有当enablePreLoad=true时生效
    expandSidebar = false					# 默认展开左侧边导航栏
    logosPath     = "assets/images/logos"			# 网站每个导航地址logo存放地址
    defaultLogo   = "assets/images/logos/default.webp"		# logo图片资源不存在或者错误时, 默认显示的logo; 该参数如为空,将会一直加载对应的logo,直至成功
    nightMode     = false					# 默认站点为深色(夜间)模式
    yiyan         = true                         		# 默认启用一言服务
    fancybox      = true                                        # 使用 Fancybox 实现图片灯箱/放大功能

[params.seo]    
    baiduhmid       = ''                        	# 百度统计 hm.src 的 ID
    baiduSiteVer    = ''                        	# 百度HTML标签验证(baidu-site-verification)
    tj51laid        = ''                        	# 51.LA 网站统计
    tj51lack        = ''
    GoogleAdsClient = ''					# Google AdSense 

[params.qweather]
    key = "a34d3676a1f8477c8a9bfffa68a4a82a"

[params.images]
    favicon           = "images/logo.png?v=2"
    searchImageL      = "assets/images/bg-dna.jpg"		# 搜索部分浅色背景图
    searchImageD      = "assets/images/bg-dna.jpg"		# 搜索部分深色背景图
    logoExpandLight   = "images/logo.png?v=2"
    logoExpandDark    = "images/logo.png?v=2"
    logoCollapseLight = "images/logo.png?v=2"
    logoCollapseDark  = "images/logo.png?v=2"
    
[markup.goldmark.renderer]
    unsafe = true

[params.footer]
    copyright = '© WebStack/Hugo/xmore2046@outlook.com'
