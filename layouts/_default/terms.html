{{ partial "header.html" . }}
{{ partial "sidebar.html" . }}
<main class="main-content flex-fill grid-bg">
    <div class="container-fluid py-5">
        <header class="mb-4">
            <p class="text-muted text-xs mb-2">网址导航分类</p>
            <h1 class="text-gray text-lg mb-0">{{ .Title }}</h1>
        </header>
        <div class="row">
            {{ range .Data.Terms.Alphabetical }}
            <div class="col-6 col-md-4 col-xl-3 mb-4">
                <a class="card h-100" href="{{ .Page.RelPermalink }}">
                    <div class="card-body">
                        <strong>{{ .Page.Title }}</strong>
                        <p class="text-muted text-xs mb-0 mt-2">{{ .Count }} 个链接</p>
                    </div>
                </a>
            </div>
            {{ end }}
        </div>
    </div>
</main>
{{ partial "footer.html" . }}
