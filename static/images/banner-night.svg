<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 500" preserveAspectRatio="xMidYMid slice" role="img" aria-label="xmore2046 网址导航夜间 banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16171a"/>
      <stop offset="0.5" stop-color="#1b1d1f"/>
      <stop offset="1" stop-color="#232427"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <radialGradient id="glowP" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6D5BDD" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#6D5BDD" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowV" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#9B5CF6" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#9B5CF6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowO" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#d95f3f" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#d95f3f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1d1f" stop-opacity="0"/>
      <stop offset="1" stop-color="#1b1d1f" stop-opacity="1"/>
    </linearGradient>
  </defs>
  <!-- 深灰底 -->
  <rect width="1600" height="500" fill="url(#bg)"/>
  <!-- 微网格 -->
  <rect width="1600" height="500" fill="url(#grid)"/>
  <!-- 蓝紫 + 橙光晕 -->
  <ellipse cx="1260" cy="40" rx="540" ry="360" fill="url(#glowP)"/>
  <ellipse cx="260" cy="470" rx="460" ry="300" fill="url(#glowV)"/>
  <ellipse cx="1120" cy="430" rx="380" ry="260" fill="url(#glowO)"/>
  <!-- 导航网格圆点装饰 -->
  <g fill="#ffffff" fill-opacity="0.14">
    <circle cx="96"  cy="96"  r="6"/>
    <circle cx="96"  cy="180" r="6"/>
    <circle cx="180" cy="96"  r="6"/>
    <circle cx="96"  cy="268" r="6"/>
    <circle cx="1504" cy="96"  r="6"/>
    <circle cx="1504" cy="180" r="6"/>
    <circle cx="1420" cy="96"  r="6"/>
    <circle cx="1504" cy="268" r="6"/>
    <circle cx="800" cy="52"  r="4"/>
  </g>
  <!-- 底部过渡到页面背景 -->
  <rect y="400" width="1600" height="100" fill="url(#fade)"/>
</svg>
