<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 500" preserveAspectRatio="xMidYMid slice" role="img" aria-label="xmore2046 网址导航 banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#39376b"/>
      <stop offset="0.35" stop-color="#4F46E5"/>
      <stop offset="0.68" stop-color="#6D5BDD"/>
      <stop offset="1" stop-color="#9B5CF6"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <radialGradient id="glowW" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowO" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#d95f3f" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#d95f3f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f9f9f9" stop-opacity="0"/>
      <stop offset="1" stop-color="#f9f9f9" stop-opacity="1"/>
    </linearGradient>
  </defs>
  <!-- 品牌蓝紫渐变底 -->
  <rect width="1600" height="500" fill="url(#bg)"/>
  <!-- 网格质感 -->
  <rect width="1600" height="500" fill="url(#grid)"/>
  <!-- 光晕 -->
  <ellipse cx="1330" cy="60" rx="520" ry="340" fill="url(#glowW)"/>
  <ellipse cx="300" cy="480" rx="460" ry="300" fill="url(#glowW)"/>
  <ellipse cx="1180" cy="420" rx="360" ry="240" fill="url(#glowO)"/>
  <!-- 导航网格圆点装饰（呼应 logo） -->
  <g fill="#ffffff" fill-opacity="0.18">
    <circle cx="96"  cy="96"  r="6"/>
    <circle cx="96"  cy="180" r="6"/>
    <circle cx="180" cy="96"  r="6"/>
    <circle cx="96"  cy="268" r="6"/>
    <circle cx="1504" cy="96"  r="6"/>
    <circle cx="1504" cy="180" r="6"/>
    <circle cx="1420" cy="96"  r="6"/>
    <circle cx="1504" cy="268" r="6"/>
    <circle cx="800" cy="52"  r="4"/>
  </g>
  <!-- 底部过渡到页面背景 -->
  <rect y="400" width="1600" height="100" fill="url(#fade)"/>
</svg>
