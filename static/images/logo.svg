<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="xmore2046 网址导航">
  <defs>
    <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="0.6" stop-color="#7C6CF6"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
  </defs>
  <!-- 渐变圆角底：无边框、无白色背景 -->
  <rect x="28" y="28" width="456" height="456" rx="120" fill="url(#lg)"/>
  <!-- 简约导航窗口：白色圆角窗框 -->
  <rect x="142" y="142" width="228" height="228" rx="52" fill="none" stroke="#FFFFFF" stroke-width="38"/>
  <!-- 窗口内两条内容线（导航条隐喻），下方一条半透明增加层次 -->
  <line x1="206" y1="230" x2="306" y2="230" stroke="#FFFFFF" stroke-width="38" stroke-linecap="round"/>
  <line x1="206" y1="306" x2="306" y2="306" stroke="#FFFFFF" stroke-width="38" stroke-linecap="round" opacity=".55"/>
</svg>
