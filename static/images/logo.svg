<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="xmore2046 网址导航">
  <defs>
    <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="0.55" stop-color="#6D5BDD"/>
      <stop offset="1" stop-color="#9B5CF6"/>
    </linearGradient>
  </defs>
  <!-- 渐变圆角底：无边框、无白色背景 -->
  <rect x="28" y="28" width="456" height="456" rx="118" fill="url(#lg)"/>
  <!-- 网格行 1 -->
  <circle cx="198" cy="198" r="20" fill="#FFFFFF"/>
  <circle cx="256" cy="198" r="20" fill="#FFFFFF"/>
  <circle cx="314" cy="198" r="20" fill="#FFFFFF"/>
  <!-- 网格行 2（中心点加大强调） -->
  <circle cx="198" cy="256" r="20" fill="#FFFFFF"/>
  <circle cx="256" cy="256" r="28" fill="#FFFFFF"/>
  <circle cx="314" cy="256" r="20" fill="#FFFFFF"/>
  <!-- 网格行 3 -->
  <circle cx="198" cy="314" r="20" fill="#FFFFFF"/>
  <circle cx="256" cy="314" r="20" fill="#FFFFFF"/>
  <circle cx="314" cy="314" r="20" fill="#FFFFFF"/>
  <!-- 底部高光 -->
  <rect x="64" y="384" width="384" height="14" rx="7" fill="#FFFFFF" opacity="0.35"/>
</svg>
