<script>        
    $(document).ready(function(){
        // 子分类 Tab 联动：目标为 tab-pane 时先激活对应 Tab，再滚动到所在分类标题
        function activateModuleTab(hash){
            var $tab = $('.module-tab[href="' + hash + '"]');
            if(!$tab.length){ console.warn('activateModuleTab: no tab for', hash); return; }
            var $sec = $tab.closest('.taxo-section');
            if(!$sec.length){ $sec = $tab.closest('.tab-content').parent(); }
            $sec.find('.module-tab').removeClass('active');
            $tab.addClass('active');
            $sec.find('.tab-pane').removeClass('show active');
            $(hash).addClass('show active');
        }
        function scrollToHash(hash){
            var $target = $(hash);
            if(!$target.length){ console.warn('scrollToHash: target not found', hash); return; }
            var top;
            if($target.hasClass('tab-pane')){
                if(!$target.hasClass('active')){
                    activateModuleTab(hash);
                }
                var $sec = $target.closest('.taxo-section');
                top = ($sec.length ? $sec.find('.site-tag').first().offset().top : $target.offset().top) - 90;
            }else{
                top = $target.offset().top - 90;
            }
            $("html, body").animate({scrollTop: top}, {duration: 500, easing: "swing"});
        }
        window.activateModuleTab = activateModuleTab;
        window.scrollToHash = scrollToHash;
        // 点击子分类模块：原地切换对应收藏内容
        $(document).on('click', '.module-tab', function (e) {
            e.preventDefault();
            activateModuleTab($(this).attr('href'));
        });
        setTimeout(function () {
            if ($('a.smooth[href="' + window.location.hash + '"]')[0]) {
                $('a.smooth[href="' + window.location.hash + '"]').click();
            }else if (window.location.hash != '') {
                scrollToHash(window.location.hash);
            }
        }, 300);
        $(document).on('click','a.smooth',function(ev) {
            if($('#sidebar').hasClass('show') && !$(this).hasClass('change-href')){
                $('#sidebar').modal('toggle');
            }
            var href = $(this).attr("href");
            if(href && href.substr(0, 1) == "#"){
                scrollToHash(href);
            }
            if($(this).hasClass('go-search-btn')){
                $('#search-text').focus();
            }
            if(!$(this).hasClass('change-href')){
                var menu =  $("a"+href);
                menu.click();
                toTarget(menu.parent().parent(),true,true);
            }
        });
        $(document).on('click','a.tab-noajax',function(ev) {
            var url = $(this).data('link');
            if(url)
                $(this).parents('.d-flex.flex-fill.flex-tab').children('.btn-move.tab-move').show().attr('href', url);
            else
                $(this).parents('.d-flex.flex-fill.flex-tab').children('.btn-move.tab-move').hide();
        });
        
    });
</script>

<script>
//夜间(日间)模式
(function(){
    // 统一状态：夜间 -> io-black-mode + night；白天 -> io-grey-mode（移除 night/io-black-mode）
    function applyNight(isNight){
        if(isNight){
            document.body.classList.remove('io-grey-mode');
            document.body.classList.add('io-black-mode');
            document.body.classList.add('night');
            document.cookie = "night=1;path=/";
        }else{
            document.body.classList.remove('io-black-mode');
            document.body.classList.remove('night');
            document.body.classList.add('io-grey-mode');
            document.cookie = "night=0;path=/";
        }
    }
    var night = document.cookie.replace(/(?:(?:^|.*;\s*)night\s*\=\s*([^;]*).*$)|^.*$/, "$1");
    if(night === ''){
        // 未手动选择过：跟随系统深色模式偏好，默认暗色
        night = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? '1' : '0';
    }
    applyNight(night == '1');
    console.log(night == '1' ? '夜间模式开启' : '夜间模式关闭');
})();
